services:
  - type: web
    name: tasknotes-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tasknotes-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: tasknotes-frontend
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: tasknotes-db
    databaseName: tasknotes
    user: tasknotes
    plan: free
    region: frankfurt
